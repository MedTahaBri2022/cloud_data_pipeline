# Shape of the Secret the workloads expect. Real values are never committed:
#
#   PASSWORD="$(openssl rand -hex 16)"
#   kubectl -n retail-pipeline create secret generic pipeline-secrets \
#     --from-literal=POSTGRES_PASSWORD="$PASSWORD" \
#     --from-literal=WAREHOUSE_DSN="postgresql://pipeline:$PASSWORD@postgres:5432/warehouse"
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-secrets
  namespace: retail-pipeline
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  WAREHOUSE_DSN: postgresql://pipeline:replace-me@postgres:5432/warehouse
