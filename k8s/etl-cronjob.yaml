# The same pipeline package that Airflow runs task by task, here as a single
# scheduled job: the Kubernetes-native way to run it without Airflow.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retail-etl
spec:
  schedule: "0 * * * *"
  # A run that is still going must finish before the next one starts
  # (two runs would race on the watermark).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: retail-etl
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: etl
              image: retail-etl:1.0.0
              imagePullPolicy: IfNotPresent
              args: ["all"]
              envFrom:
                - configMapRef:
                    name: pipeline-config
              env:
                - name: WAREHOUSE_DSN
                  valueFrom:
                    secretKeyRef:
                      name: pipeline-secrets
                      key: WAREHOUSE_DSN
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
