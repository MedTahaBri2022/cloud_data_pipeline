apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ingestion-api
  ports:
    - port: 80
      targetPort: http
      nodePort: 30081
---
# Stateless, so it scales horizontally: two replicas behind the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: retail-ingestion-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: WAREHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: WAREHOUSE_DSN
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
