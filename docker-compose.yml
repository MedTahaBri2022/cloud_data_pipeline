# Local platform: sources, warehouse, ingestion API and Airflow.
#   docker compose up -d --build
x-pipeline-env: &pipeline-env
  WAREHOUSE_DSN: postgresql://pipeline:${POSTGRES_PASSWORD:-pipeline}@postgres:5432/warehouse
  MONGO_URL: mongodb://mongo:27017
  MONGO_DATABASE: raw

x-airflow: &airflow
  build: ./airflow
  environment:
    <<: *pipeline-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipeline:${POSTGRES_PASSWORD:-pipeline}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-development-only}
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
    # The DAG imports the same package that the CLI and the CronJob run.
    PYTHONPATH: /opt/airflow/etl
    SQL_DIR: /opt/airflow/sql
    DATA_DIR: /opt/airflow/data/raw
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/check_dags.py:/opt/airflow/check_dags.py:ro
    - ./etl:/opt/airflow/etl:ro
    - ./sql:/opt/airflow/sql:ro
    - ./data:/opt/airflow/data:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: warehouse
    ports:
      - '54324:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pipeline -d warehouse']
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - '27018:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingestion-api:
    build: ./ingestion-api
    environment:
      <<: *pipeline-env
      PORT: 8080
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # One-shot: migrates Airflow's metadata database and creates the UI user.
  airflow-init:
    <<: *airflow
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow users create --role Admin
        --username "${AIRFLOW_ADMIN_USER:-admin}"
        --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"
        --firstname Data --lastname Engineer --email admin@example.com

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - '8081:8080'
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  mongo-data:
  airflow-logs:
